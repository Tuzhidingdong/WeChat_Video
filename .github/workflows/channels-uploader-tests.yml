name: Channels uploader unit tests

on:
  push:
    branches:
      - feat/milestone-2-channels-draft-uploader
  pull_request:
    branches:
      - feat/slice-a-english-visual-refinement

jobs:
  channels-uploader-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portable unit-test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest "numpy<3" PyYAML psutil playwright
      - name: Compile production modules
        run: python -m compileall -q src
      - name: Run portable tests (local models/fonts are validated on Windows)
        run: |
          python -m pytest -q \
            tests/test_article_summary_source.py \
            tests/test_core.py \
            tests/test_qa_hardening.py \
            tests/test_final_refinement_v3.py \
            tests/test_channels_upload.py
