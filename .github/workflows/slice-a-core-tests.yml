name: Slice A core tests

on:
  push:
    branches:
      - main
      - feat/milestone-1-slice-a
  pull_request:
    branches:
      - main

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run pure-Python core tests
        run: python -m pytest
